# Type  Path                        Mode  User  Group  Age  Argument
# Ensure the destination parent directory exists
d       %h/.config/Kvantum/pywal           0755  -     -      -    -

# Create or overwrite the symlink pointing to the pywal theme
L+      %h/.config/Kvantum/pywal/pywal.kvconfig     -     -     -      -    %h/.cache/wal/pywal.kvconfig
L+      %h/.config/Kvantum/pywal/pywal.svg          -     -     -      -    %h/.cache/wal/pywal.svg
