# Type  Path                        Mode  User  Group  Age  Argument
# Ensure the destination parent directory exists
d       %h/.config/ghostty/themes           0755  -     -      -    -

# Create or overwrite the symlink pointing to the pywal theme
L+      %h/.config/ghostty/themes/pywal     -     -     -      -    %h/.cache/wal/ghostty.conf
