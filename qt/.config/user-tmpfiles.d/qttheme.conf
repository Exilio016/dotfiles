# Type  Path                              Mode  User  Group  Age  Argument
# Ensure the destination parent directory exists
d       %h/.config/qt5ct/colors           0755  -     -      -    -
d       %h/.config/qt6ct/colors           0755  -     -      -    -
d       %h/.config/qt6ct/qss              0755  -     -      -    -

# Create or overwrite the symlink pointing to the pywal theme
L+      %h/.config/qt5ct/colors/pywal.conf     -     -     -      -    %h/.cache/wal/qt6ct.conf
L+      %h/.config/qt6ct/colors/pywal.conf     -     -     -      -    %h/.cache/wal/qt6ct.conf
L+      %h/.config/qt6ct/qss/pywal.qss         -     -     -      -    %h/.cache/wal/qt6ct.qss
